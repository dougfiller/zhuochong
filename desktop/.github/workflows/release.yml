name: Release (disabled pending product identity and signing)

on:
  workflow_dispatch:

# This repository is a frozen upstream-derived baseline. A formal release remains
# blocked until the product owner supplies the product identifier, authorized icon,
# controlled update endpoint and key, signing certificate reference, and timestamp
# service. Keeping the old workflow would risk publishing upstream-named assets.
jobs:
  release-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Report missing release gate inputs
        run: |
          echo "Formal release is disabled until product identity, asset authorization, signing, and updater trust-chain inputs are approved."
          exit 1
